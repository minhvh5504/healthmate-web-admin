services:
  admin:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://api.healthmate.dev/api
    container_name: healthmate_admin_v2
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3001:3000"
    networks:
      - healthmate_network
    healthcheck:
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
networks:
  healthmate_network:
    name: healthmate_network
    driver: bridge
